services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRESQL_DB:-siem}
      POSTGRES_USER: ${POSTGRESQL_USER:-siem}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD:-siem-local-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER:-siem} -d ${POSTGRESQL_DB:-siem}"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8000
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: 5432
      DATABASE_URL: ""
      CORS_ORIGINS: http://localhost
      TRUST_PROXY: "1"
      REPORT_STORAGE_DIR: /app/storage/reports
    volumes:
      - report-storage:/app/storage/reports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
volumes:
  postgres-data:
  report-storage:
