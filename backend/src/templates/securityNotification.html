<p style="margin:0 0 14px">Hello {{userName}},</p>
<div style="margin:0 0 16px;padding:12px 14px;border-radius:8px;border-left:4px solid {{accent}};background:#f8fafc">
  <div style="font-size:16px;font-weight:bold;margin-bottom:4px">{{heading}}</div>
  <div>{{message}}</div>
</div>
{{{detailsTable}}}
<p style="margin:16px 0 0">{{advice}}</p>
{{#link}}<p style="margin:18px 0 0;text-align:center"><a href="{{link}}" style="display:inline-block;padding:10px 20px;background:#20a383;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:bold">{{linkText}}</a></p>{{/link}}
